<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#d6d6c9">
    <meta name="description" content="A live fog possibility reading for field testing in Lutkemeerpolder, rooted in the Eilandspolder project.">

    <title>FOG — alejandro ramírez</title>

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css?v=98fe9eb">
</head>

<body>
    <main class="fog-page">
        <h1 class="fog-reading" aria-label="Fog possibility">
            FOG <span id="fog-score" aria-live="polite">—</span>
        </h1>

        <p class="fog-data" id="fog-data" aria-live="polite">Loading weather…</p>
        <p class="fog-place" id="fog-place">Lutkemeerpolder field test · FOODIsEVERYWHERE FOG project</p>
        <p class="fog-source"><a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a> · KNMI HARMONIE AROME Netherlands</p>
        <p class="fog-diagnostics" id="fog-diagnostics"></p>
    </main>
    
    <script>
        const latitude = 52.3628;
        const longitude = 4.7646;
        const timezone = "Europe/Amsterdam";
        const refreshInterval = 60 * 60 * 1000;

        const scoreElement = document.querySelector("#fog-score");
        const dataElement = document.querySelector("#fog-data");
        const placeElement = document.querySelector("#fog-place");
        const diagnosticsElement = document.querySelector("#fog-diagnostics");

        const parameters = new URLSearchParams({
            latitude,
            longitude,
            hourly: "temperature_2m,relative_humidity_2m,dew_point_2m,wind_speed_10m,rain,visibility,cloud_cover",
            models: "knmi_harmonie_arome_netherlands",
            forecast_days: "2",
            timezone,
            wind_speed_unit: "ms",
            timeformat: "unixtime"
        });

        const apiUrl = `https://api.open-meteo.com/v1/forecast?${parameters}`;

        const number = (value, digits = 0) => Number(value).toFixed(digits);

        function localTime(timestamp) {
            return new Intl.DateTimeFormat("en-GB", {
                timeZone: timezone,
                weekday: "short",
                day: "numeric",
                month: "short",
                hour: "2-digit",
                minute: "2-digit",
                hourCycle: "h23"
            }).format(new Date(timestamp * 1000));
        }
// FOG MODEL C — FIELD OBSERVATION

function interpolate(value, points) {
    if (!Number.isFinite(value)) return null;

    if (value <= points[0][0]) return points[0][1];

    for (let i = 1; i < points.length; i++) {
        const [x1, y1] = points[i - 1];
        const [x2, y2] = points[i];

        if (value <= x2) {
            return y1 + (value - x1) *
                (y2 - y1) / (x2 - x1);
        }
    }

    return points[points.length - 1][1];
}

const curves = {
    dew: [
        [0, 100],
        [0.2, 95],
        [0.5, 85],
        [1, 65],
        [1.5, 45],
        [2, 25],
        [3, 8],
        [4, 0]
    ],

    humidity: [
        [70, 0],
        [75, 10],
        [80, 25],
        [85, 45],
        [90, 65],
        [93, 78],
        [96, 90],
        [98, 97],
        [100, 100]
    ],

    visibility: [
        [0, 100],
        [200, 100],
        [500, 90],
        [1000, 75],
        [2000, 55],
        [5000, 25],
        [10000, 0],
        [20000, 0]
    ],

    wind: [

    [0, 100],
    [0.5, 95],
    [1, 85],
    [1.5, 80],
    [2, 70],
    [2.5, 55],
    [3, 40],
    [3.5, 25],
    [4, 10]
    ],

    cloud: [
        [0, 100],
        [20, 90],
        [40, 75],
        [60, 55],
        [80, 30],
        [100, 10]
    ]
};

function calculateFogScore({
    dewSpread,
    humidity,
    visibility,
    wind,
    cloud
}) {
    const components = {
        dew: interpolate(dewSpread, curves.dew),
        humidity: interpolate(humidity, curves.humidity),
        visibility: interpolate(visibility, curves.visibility),
        wind: interpolate(wind, curves.wind),
        cloud: interpolate(cloud, curves.cloud)
    };

    const weights = {
        dew: 30,
        humidity: 20,
        visibility: 25,
        wind: 15,
        cloud: 10
    };

    let total = 0;
    let availableWeight = 0;

    for (const key in components) {
        if (components[key] === null) continue;

        total += components[key] * weights[key];
        availableWeight += weights[key];
    }

    if (availableWeight === 0) {
        return null;
    }

    const score = Math.round(total / availableWeight);

    return {
    score: wind > 4 ? 0 : score,
    rawScore: score,
    components,
    weights,
    availableWeight,
    windBlocked: wind > 4
    };
}
        function renderWeather(weather) {
            const hours = weather.hourly;
            const now = Date.now() / 1000;
            const index = hours.time.reduce((bestIndex, timestamp, currentIndex) => {
                return Math.abs(timestamp - now) < Math.abs(hours.time[bestIndex] - now)
                    ? currentIndex
                    : bestIndex;
            }, 0);

            const temperature = hours.temperature_2m[index];
            const humidity = hours.relative_humidity_2m[index];
            const dewPoint = hours.dew_point_2m[index];
            const wind = hours.wind_speed_10m[index];
            const rain = hours.rain[index];
            const visibility = hours.visibility[index];
            const dewSpread = temperature - dewPoint;
            // FOG MODEL C — FIELD OBSERVATION
            // Experimental scoring model. Calibration pending field observations.
            //
            // Weighted components:
            // Dew-point spread: 30%
            // Relative humidity: 20%
            // Visibility: 25%
            // Wind: 15%
            // Cloud cover: 10%
            //
            // Rain is contextual only and does not reduce the score.
            // Wind >= 3 m/s triggers the project-specific IMPOSSIBLE condition.

            const cloud = hours.cloud_cover[index];

            // Calculate individual atmospheric contributions
            const fog = calculateFogScore({
                dewSpread,
                humidity,
                visibility,
                wind,
                cloud
            });

            // Final FOG possibility score
            const fogPossibility = fog?.score ?? null;

            scoreElement.textContent =
                fogPossibility === null
                    ? "—"
                    : String(fogPossibility);

            // FOG MODEL C — DIAGNOSTICS

const componentNames = {
    dew: "DEW",
    humidity: "RH",
    visibility: "VIS",
    wind: "WIND",
    cloud: "CLOUD"
};

// Display individual component scores
const diagnosticText = Object.entries(fog.components)
    .map(([key, value]) =>
        `${componentNames[key]} ${value === null
            ? "—"
            : Math.round(value)}`
    )
    .join(" · ");

// Show percentage of model weight supported by available data
const coverage = fog.availableWeight;

diagnosticsElement.textContent =
    `${diagnosticText} · DATA ${coverage}%` +
    (fog.windBlocked ? " · WIND BLOCKED" : "");



            const visibilityText = Number.isFinite(visibility)
    ? `${number(visibility / 1000, 1)} km`
    : "unavailable";

    dataElement.innerHTML =
       `${fogPossibility === null ? "—" : `${fogPossibility}/100`}  |  ` +
       `dew spread ${number(dewSpread, 1)}°C · ` +
       `RH ${number(humidity)}% · ` +
       `visibility ${visibilityText} · ` +
       `<span class="${wind > 4 ? "wind-alert" : ""}">` +
       `wind ${number(wind, 1)} m/s` +
       `</span> · ` +
       `rain ${number(rain, 1)} mm · ` +
       `temp. ${number(temperature)}°C`;

            placeElement.textContent = `Lutkemeerpolder field test · FOODIsEVERYWHERE FOG project · ${localTime(hours.time[index])} · Grid point ${weather.latitude.toFixed(3)}° N | ${weather.longitude.toFixed(3)}° E`;
        }

        async function updateWeather() {
            try {
                const response = await fetch(apiUrl, { cache: "no-store" });
                if (!response.ok) throw new Error(`Weather service returned ${response.status}`);

                const weather = await response.json();
                renderWeather(weather);

           } catch (error) {
            // Preserve the last valid weather reading.
        // Clearly indicate that the data connection has failed.

               diagnosticsElement.textContent +=
               " · OLD DATA — Open-Meteo not responding";

               console.warn(
               "FOG: Open-Meteo unavailable. Displaying previous reading.",
              error
    );
  }
}

        updateWeather();
        window.setInterval(updateWeather, refreshInterval);
    </script>
</body>

</html>
