<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#d6d6c9">
    <meta name="description" content="A live fog possibility reading for field testing in Lutkemeerpolder, rooted in the Eilandspolder project.">

    <title>FOG — alejandro ramírez</title>

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css?v=98fe9eb">
</head>

<body>
    <main class="fog-page">
        <h1 class="fog-reading" aria-label="Fog possibility">
            FOG <span id="fog-score" aria-live="polite">—</span>
        </h1>

        <p class="fog-data" id="fog-data" aria-live="polite">Loading weather…</p>
        <p class="fog-place" id="fog-place">Lutkemeerpolder field test · FOODIsEVERYWHERE FOG project</p>
        <p class="fog-source"><a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a> · KNMI HARMONIE AROME Netherlands</p>
    </main>

    <script>
        const latitude = 52.3628;
        const longitude = 4.7646;
        const timezone = "Europe/Amsterdam";
        const refreshInterval = 60 * 60 * 1000;

        const scoreElement = document.querySelector("#fog-score");
        const dataElement = document.querySelector("#fog-data");
        const placeElement = document.querySelector("#fog-place");

        const parameters = new URLSearchParams({
            latitude,
            longitude,
            hourly: "temperature_2m,relative_humidity_2m,dew_point_2m,wind_speed_10m,rain,visibility",
            models: "knmi_harmonie_arome_netherlands",
            forecast_days: "2",
            timezone,
            wind_speed_unit: "ms",
            timeformat: "unixtime"
        });

        const apiUrl = `https://api.open-meteo.com/v1/forecast?${parameters}`;

        const number = (value, digits = 0) => Number(value).toFixed(digits);

        function localTime(timestamp) {
            return new Intl.DateTimeFormat("en-GB", {
                timeZone: timezone,
                weekday: "short",
                day: "numeric",
                month: "short",
                hour: "2-digit",
                minute: "2-digit",
                hourCycle: "h23"
            }).format(new Date(timestamp * 1000));
        }

        function renderWeather(weather) {
            const hours = weather.hourly;
            const now = Date.now() / 1000;
            const index = hours.time.reduce((bestIndex, timestamp, currentIndex) => {
                return Math.abs(timestamp - now) < Math.abs(hours.time[bestIndex] - now)
                    ? currentIndex
                    : bestIndex;
            }, 0);

            const temperature = hours.temperature_2m[index];
            const humidity = hours.relative_humidity_2m[index];
            const dewPoint = hours.dew_point_2m[index];
            const wind = hours.wind_speed_10m[index];
            const rain = hours.rain[index];
            const visibility = hours.visibility[index];
            const dewSpread = temperature - dewPoint;

            // A nonlinear dew score plus raw RH reproduces the approved Test 6 reading.
            // Wind and rain are displayed as context and never reduce the score.
            // FOG scoring — Model B (proposed test curve)
// Dew spread and RH have equal weight.
// Wind and rain are displayed as context; neither affects the score.

function scoreDewSpread(spread) {
    if (!Number.isFinite(spread) || spread < 0) return null;

    if (spread < 0.05) return 100;
    if (spread < 0.10) return 85;
    if (spread < 0.20) return 60;
    if (spread < 0.30) return 30;
    if (spread < 0.40) return 10;
    if (spread <= 0.50) return 3;
    return 1;
}

function scoreRelativeHumidity(humidity) {
    if (!Number.isFinite(humidity) || humidity < 0 || humidity > 100) {
        return null;
    }

    if (humidity < 96) return 1;
    if (humidity < 97) return 2;
    if (humidity < 98) return 4;
    if (humidity < 99) return 30;
    return 100;
}

const dewScore = scoreDewSpread(dewSpread);
const rhScore = scoreRelativeHumidity(humidity);

const fogPossibility =
    dewScore !== null && rhScore !== null
        ? Math.round((dewScore + rhScore) / 2)
        : null;


            scoreElement.textContent =
    fogPossibility === null ? "—" : String(fogPossibility);
            const visibilityText = Number.isFinite(visibility)
    ? `${number(visibility / 1000, 1)} km`
    : "unavailable";

    dataElement.innerHTML =
       `${fogPossibility === null ? "—" : `${fogPossibility}/100`}  |  ` +
       `dew spread ${number(dewSpread, 1)}°C · ` +
       `RH ${number(humidity)}% · ` +
       `visibility ${visibilityText} · ` +
       `<span class="${wind > 4 ? "wind-alert" : ""}">` +
       `wind ${number(wind, 1)} m/s` +
       `</span> · ` +
       `rain ${number(rain, 1)} mm · ` +
       `temp. ${number(temperature)}°C`;

            placeElement.textContent = `Lutkemeerpolder field test · FOODIsEVERYWHERE FOG project · ${localTime(hours.time[index])} · Grid point ${weather.latitude.toFixed(3)}° N | ${weather.longitude.toFixed(3)}° E`;
        }

        async function updateWeather() {
            try {
                const response = await fetch(apiUrl, { cache: "no-store" });
                if (!response.ok) throw new Error(`Weather service returned ${response.status}`);

                const weather = await response.json();
                renderWeather(weather);
            } catch (error) {
                scoreElement.textContent = "—";
                dataElement.textContent = "Live weather data is temporarily unavailable.";
                console.error("FOG weather update failed", error);
            }
        }

        updateWeather();
        window.setInterval(updateWeather, refreshInterval);
    </script>
</body>

</html>
