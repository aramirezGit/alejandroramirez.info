<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#d6d6c9">

    <title>alejandro ramírez ︱ reel</title>

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/assets/favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" sizes="180x180">

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <main class="reel-page">


        <!-- ======================================================
             identity
        ======================================================= -->

        <header class="identity">

            <h1>alejandro ramírez</h1>

            <div class="identity-meta">

                <p>studio</p>

                <a class="back" href="images-room.html">
                    ← back ·
                </a>

            </div>

        </header>



        <!-- ======================================================
             reel
        ======================================================= -->

        <section class="reel-work">


            <!-- principal video -->

            <div class="reel-main-video">

                <video
                    controls
                    playsinline
                    preload="metadata"
                    poster="assets/images/d4.jpg"
                >

                    <source
                        src="assets/video/GRID/d2.mp4"
                        type="video/mp4"
                    >

                    Your browser does not support HTML video.

                </video>

            </div>



            <!-- work information -->

            <div class="reel-information">

                <h2 class="reel-title">reel</h2>

                <div class="reel-credits">

                    <p>FILMMAKER &amp; CINEMATOGRAPHER</p>

                    <p>PORTRAITS &amp; LANDSCAPES</p>

                </div>

            

                <div class="reel-description">

                    <!-- Work description will go here. -->

                </div>

            </div>



            <!-- ==================================================
                 image accumulation
            =================================================== -->

            <div class="reel-material">

                <div class="reel-fragment reel-fragment-01">

                    <img
                        src="assets/images/d4.jpg"
                        alt=""
                        loading="lazy"
                    >

                </div>

                <div class="reel-fragment reel-fragment-02">

                    <img
                        src="assets/images/d5.jpg"
                        alt=""
                        loading="lazy"
                    >

                </div>

                <div class="reel-fragment reel-fragment-03">

                    <img
                        src="assets/images/d7.jpg"
                        alt=""
                        loading="lazy"
                    >

                </div>

                <!-- Three additional stills will go here. -->

            </div>


        </section>


    </main>

</body>

</html>
